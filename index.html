      (amW && req.length ? '<p class="note">みんなが2回目に挑戦します</p>' : '<div class="btns"><button class="btn warm" data-act="o-retry">2回目に挑戦する</button></div>');
  } else if (amW && req.length) {
    tail = `<p class="msg">あなたのクローバーをみんなが推理中…</p><p class="note">出題者はしゃべらずに見守ってね（推理中はチャットも使えません）</p>${okNames ? `<p class="note">OK：${esc(okNames)}</p>` : ''}`;
  } else {
    tail = `<div class="btns"><button class="btn ${mine ? 'sub' : ''}" data-act="o-ok" ${full ? '' : 'disabled'}>${mine ? 'OKを取り消す' : (g.attempt === 1 ? 'これでOK' : 'これで最終回答')}（${g.ok.length}/${Math.max(1, req.length)}）</button>
      <button class="btn sub" data-act="o-clear">置いたカードを手札に戻す</button></div>
      <p class="note">${req.length > 1 ? '推理する全員がOKすると回答します。' : ''}${okNames ? `OK：${esc(okNames)}` : ''}</p>`;
  }
  const hint = !play ? '' : sel !== null ? (selOnBoard ? '置きたい場所をタップ（手札の枠をタップで戻す）' : '置きたい場所をタップ') : 'カードをタップ → 置きたい場所をタップ。↻ で回転。みんなの画面に反映されます';
  return obar(amW ? 'あなたのクローバー' : `${esc(pl.name)}さんのクローバー`) +
    `<p class="note">クローバー ${G.cur + 1}/${G.order.length}・${g.attempt === 1 ? '1回目' : '2回目（ラスト）'}・得点 ${G.order.reduce((a, t) => a + (G.P[t].score || 0), 0)}</p>` +
    clover(cells, pl.clues) + (hint ? `<p class="note">${hint}</p>` : '') +
    (g.fb ? '' : `<div class="tray-label"><span>手札（おとり1枚入り）</span></div><div class="tray ${play && selOnBoard ? 'target' : ''}" ${play ? 'data-act="o-tray"' : ''}>${trayHTML}</div>`) + tail;
}
function vOResult() {
  const G = OL.room.game, pl = S.players[S.cur], last = G.cur === G.order.length - 1;
  return obar(`${pl.plain ? 'あなた' : esc(pl.name) + 'さん'}のクローバー`) + scoreHead(pl.score) + reviewHTML(pl) +
    `<div class="btns"><button class="btn" data-act="o-next">${last ? '最終結果を見る' : '次のクローバーへ'}</button></div>`;
}
function vOEnd() {
  const G = OL.room.game, t = G.order.reduce((a, k) => a + (G.P[k].score || 0), 0), max = G.order.length * 6, pct = Math.round(t / max * 100);
  const rank = pct === 100 ? '伝説の四つ葉！ 完璧なチームです 🍀' : pct >= 80 ? '息ぴったり！ 最高のチームワーク' : pct >= 60 ? 'いい感じ！ 言葉が通じ合っています' : pct >= 40 ? 'まずまず。次はもっと通じ合えるはず' : 'まだまだ伸びしろたっぷり！';
  const list = S.players.map((p, i) => `<button data-act="o-review" data-i="${i}"><span>${p.plain ? 'あなた' : esc(p.name) + 'さん'}のクローバー</span><span><b>${p.score}点</b><small>答え合わせ ›</small></span></button>`).join('');
  return obar('最終結果') + `<div class="total"><div class="logo">🏆</div><div class="num">${t}<small> / ${max}点</small></div><div class="rank">${rank}</div></div>
    <div class="list">${list}</div>
    <div class="btns">${isHostOL() ? '<button class="btn" data-act="o-again">ロビーに戻って次のゲームへ</button>' : '<p class="msg">ホストが次のゲームを準備するのを待っています</p>'}
    <button class="btn sub" data-act="o-leave">ルームを出る</button></div>`;
}
function vOReview() {
  const pl = S.players[OL.rv];
  return obar(`${pl.plain ? 'あなた' : esc(pl.name) + 'さん'}のクローバー`) + scoreHead(pl.score) + reviewHTML(pl) + `<div class="btns"><button class="btn sub" data-act="o-back-end">最終結果に戻る</button></div>`;
}
function onlineSetupHTML() {
  const act = activeRoom(), name = OL.nameDraft != null ? OL.nameDraft : (loadS(ONAME_KEY) || '');
  return `${act ? `<div class="btns"><button class="btn warm" data-act="o-rejoin" data-r="${act}">ルーム ${act} に戻る</button></div><p class="note">前と同じ席・同じ状態で戻れます</p>` : ''}
  <div class="panel">
    <label class="flabel">あなたの名前</label><input id="oname" class="finput" maxlength="10" placeholder="なまえ" value="${esc(name)}" autocomplete="off">
    <div class="btns"><button class="btn" data-act="o-create">ルームを作る（ホスト）</button></div>
    <div class="or"><span>または ルームIDで参加</span></div>
    <div class="joinrow"><input id="oroomid" class="finput" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="5桁のルームID" value="${esc(OL.roomDraft || '')}" autocomplete="off"><button class="btn" data-act="o-join">参加</button></div>
    ${OL.joinErr ? `<p class="err">${esc(OL.joinErr)}</p>` : ''}
  </div>
  <div class="btns"><button class="btn sub" data-act="rules">遊び方</button></div>
  <p class="note">招待はルームIDかURLを送るだけ。通信が切れても同じルームIDで同じ席に戻れます。<br>ホストが抜けても、残った人が自動でホストを引き継ぎます。</p>`;
}

/* ---------- チャット ---------- */
function renderChat() {
  let btn = document.getElementById('ochatBtn'), box = document.getElementById('ochat');
  const R = OL.active && OL.room;
  document.body.classList.toggle('online', !!OL.active);
  if (!R || S && S.phase === 'oconn') { if (btn) btn.remove(); if (box) box.remove(); return; }
  if (!btn) {
    btn = document.createElement('button'); btn.id = 'ochatBtn'; btn.className = 'ochat-btn'; btn.dataset.act = 'o-chat'; document.body.appendChild(btn);
    box = document.createElement('div'); box.id = 'ochat'; box.className = 'ochat';
    box.innerHTML = `<div class="ochat-head"><b>💬 チャット</b><button data-act="o-chat">閉じる</button></div><div class="ochat-log" id="ochatLog"></div>
      <form class="ochat-form" id="ochatForm"><input id="ochatIn" maxlength="120" placeholder="メッセージ" autocomplete="off"><button>送信</button></form>`;
    document.body.appendChild(box);
    box.querySelector('#ochatForm').addEventListener('submit', e => {
      e.preventDefault(); const inp = document.getElementById('ochatIn'), x = inp.value.trim();
      if (!x) return; sendAct({t: 'chat', text: x}); inp.value = '';
    });
  }
  const G = R.game, muted = G && G.phase === 'guess' && G.order[G.cur] === OL.token && guessersOL(G).length > 0;
  const n = R.chat.length; if (OL.chatOpen) OL.seenChat = n;
  const unread = Math.max(0, n - OL.seenChat);
  btn.innerHTML = `💬${unread ? `<i>${unread}</i>` : ''}`;
  box.classList.toggle('open', OL.chatOpen);
  const log = document.getElementById('ochatLog');
  log.innerHTML = R.chat.length ? R.chat.map(c => `<div class="cm-row ${c.tk === OL.token ? 'me' : ''}"><small>${esc(c.n)}</small><p>${esc(c.x)}</p></div>`).join('') : '<p class="note">まだメッセージはありません</p>';
  log.scrollTop = log.scrollHeight;
  const inp = document.getElementById('ochatIn'); inp.disabled = !!muted; inp.placeholder = muted ? '出題者は推理中は話せません' : 'メッセージ';
}

/* ---------- 操作 ---------- */
function olPick(ci) {
  const G = OL.room.game, g = G.g; if (g.fb) return;
  const w = g.where[ci]; if (w >= 0 && g.locked[w]) return;
  if (OL.sel === null) OL.sel = ci;
  else if (OL.sel === ci) OL.sel = null;
  else if (w >= 0) { sendAct({t: 'move', ci: OL.sel, s: w}); OL.sel = null; }
  else if (g.where[OL.sel] >= 0) { sendAct({t: 'move', ci, s: g.where[OL.sel]}); OL.sel = null; }
  else OL.sel = ci;
  render();
}
document.addEventListener('input', e => {
  if (e.target.id === 'oname') OL.nameDraft = e.target.value;
  if (e.target.id === 'oroomid') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5); OL.roomDraft = e.target.value; }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const A = el.dataset.act; if (!A.startsWith('o-')) return;
  switch (A) {
    case 'o-create': onlineCreate(); break;
    case 'o-join': {
      const rid = (OL.roomDraft || '').trim();
      if (!validRoom(rid)) { OL.joinErr = 'ルームIDは5桁の数字です'; render(); break; }
      onlineJoin(rid); break;
    }
    case 'o-rejoin': onlineJoin(el.dataset.r); break;
    case 'o-cancel': leaveOnline(true); render(); break;
    case 'o-leave':
      if (confirm(isHostOL() && Object.values(OL.room.members).filter(m => m.online).length > 1 ? 'ルームを出ますか？ ホストはほかの人に引き継がれます。' : 'ルームを出ますか？（同じルームIDでまた戻れます）')) { closeModal(); leaveOnline(false); render(); }
      break;
    case 'o-menu':
      openModal(`<h3>メニュー</h3><div class="btns">
        ${OL.room ? '<button class="btn sub" data-act="o-copy-url">🔗 招待URLをコピー</button>' : ''}
        <button class="btn sub" data-act="rules">遊び方</button>
        ${isHostOL() && OL.room && OL.room.game && OL.room.game.phase !== 'end' ? '<button class="btn sub" data-act="o-abort">ゲームを中止してロビーへ</button>' : ''}
        <button class="btn sub" data-act="o-leave">ルームを出る</button><button class="btn" data-act="close-modal">閉じる</button></div>`);
      break;
    case 'o-abort': if (confirm('ゲームを中止してロビーに戻りますか？')) { closeModal(); sendAct({t: 'abort'}); } break;
    case 'o-copy-id': copyText(OL.room.id, `ルームID ${OL.room.id} をコピーしました`); break;
    case 'o-copy-url': closeModal(); copyText(roomUrl(OL.room.id), '招待URLをコピーしました'); break;
    case 'o-share': navigator.share({title: '言葉のクローバー', text: `言葉のクローバーで遊ぼう！ ルームID：${OL.room.id}`, url: roomUrl(OL.room.id)}).catch(() => {}); break;
    case 'o-rename': {
      const n = prompt('名前（10文字まで）', OL.name); if (n == null) break;
      const v = n.trim().slice(0, 10); if (!v) break;
      OL.name = v; storeS(ONAME_KEY, v); sendAct({t: 'name', name: v}); break;
    }
    case 'o-start': sendAct({t: 'start'}); break;
    case 'o-submit': {
      const G = OL.room.game, d = draftOf(G), cl = d.clues.map(c => String(c || '').trim());
      if (!cl.every(Boolean)) break;
      const pl = G.P[OL.token], vis = [];
      for (let s = 0; s < 4; s++) SLOT_OUTER[s].forEach(p => vis.push(wordAt(pl.cards[s], pl.ans[s], p)));
      const bad = cl.filter(c => vis.some(w => c.includes(w)));
      if (bad.length && !confirm(`「${bad.join('」「')}」にカードの単語が含まれています。このまま進みますか？`)) break;
      sendAct({t: 'clues', clues: cl}); break;
    }
    case 'o-unclues': {
      const G = OL.room.game; storeS(draftKey(G.id, OL.token), {cards: G.P[OL.token].cards.map(c => c.k).join(), clues: G.P[OL.token].clues.slice()});
      sendAct({t: 'unclues'}); break;
    }
    case 'o-reroll': if (confirm('4枚のカードを引き直しますか？（書いたヒントは消えます）')) { dropS(draftKey(OL.room.game.id, OL.token)); sendAct({t: 'reroll'}); } break;
    case 'o-cpu': sendAct({t: 'cpu-write', target: el.dataset.t}); break;
    case 'o-pick': olPick(+el.dataset.card); break;
    case 'o-slot': if (OL.sel !== null) { sendAct({t: 'move', ci: OL.sel, s: +el.dataset.slot}); OL.sel = null; render(); } break;
    case 'o-tray': { const g = OL.room.game.g; if (OL.sel !== null && g.where[OL.sel] >= 0) { sendAct({t: 'tray', ci: OL.sel}); OL.sel = null; render(); } break; }
    case 'o-rot': e.stopPropagation(); sendAct({t: 'rot', ci: +el.dataset.card}); break;
    case 'o-clear': sendAct({t: 'clear'}); OL.sel = null; break;
    case 'o-ok': sendAct({t: 'ok'}); break;
    case 'o-retry': sendAct({t: 'retry'}); break;
    case 'o-next': sendAct({t: 'next'}); break;
    case 'o-again': sendAct({t: 'again'}); OL.rv = -1; break;
    case 'o-review': OL.rv = +el.dataset.i; viewTab = 'ans'; olDerive(); render(); break;
    case 'o-back-end': OL.rv = -1; olDerive(); render(); break;
    case 'o-chat': OL.chatOpen = !OL.chatOpen; renderChat(); if (OL.chatOpen) setTimeout(() => { const i = document.getElementById('ochatIn'); if (i && !i.disabled) i.focus(); }, 50); break;
  }
});
Object.assign(VIEWS, {oconn: vOConn, oroom: vORoom, owrite: vOWrite, oguess: vOGuess, oresult: vOResult, oend: vOEnd, oreview: vOReview});
// ?room=12345 で開いたらオンラインの参加画面へ
(() => {
  const r = OQ.get('room');
  if (validRoom(r)) {
    setupMode = 'online'; OL.roomDraft = r;
    try { const u = new URL(location.href); u.searchParams.delete('room'); history.replaceState(null, '', u.toString()); } catch (e) {}
  }
})();

render();
</script>
</body>
</html>
